version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    labels:
      - 'dependencies'
      - 'npm'
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    labels:
      - 'dependencies'
      - 'github_actions'
