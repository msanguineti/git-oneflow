name: Node.js Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published GitHub release tag
        required: true
        type: string
      expected_tarball_sha256:
        description: Original verified package tarball SHA-256 (not artifact ZIP digest)
        required: true
        type: string
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

env:
  CANDIDATE_TARBALL: ./candidate/package.tgz

jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.pack.outputs.digest }}
      revision: ${{ steps.revision.outputs.sha }}
      npm_tag: ${{ steps.context.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - id: revision
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          check-latest: true
          node-version: 26.x
      - run: npm ci
      - name: Resolve release context
        id: context
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-context.js
      - run: npm run typecheck && npm run build && npm run lint && npm run format && npm test
      - name: Pack candidate once
        id: pack
        run: |
          mkdir candidate
          npm pack --pack-destination candidate
          mv candidate/*.tgz candidate/package.tgz
          echo "digest=$(sha256sum candidate/package.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Reproduce the original release package
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_DIGEST: ${{ steps.context.outputs.expected_digest }}
        run: node scripts/verify-candidate.js candidate/package.tgz
      - name: Check npm publication without publishing
        env:
          NPM_DIST_TAG: ${{ steps.context.outputs.npm_tag }}
        run: npm publish "$CANDIDATE_TARBALL" --dry-run --tag "$NPM_DIST_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: candidate/package.tgz
          if-no-files-found: error

  test-package:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node-version: 22.x }
          - { os: ubuntu-latest, node-version: 24.x }
          - { os: ubuntu-latest, node-version: 26.x }
          - { os: macos-latest, node-version: 26.x }
          - { os: windows-latest, node-version: 26.x }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.revision }}
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          check-latest: true
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: candidate
      - name: Verify candidate identity
        env:
          EXPECTED_DIGEST: ${{ needs.candidate.outputs.digest }}
        run: node scripts/verify-candidate.js candidate/package.tgz
      - run: npm run test:package -- candidate/package.tgz

  package-checks:
    name: package-checks
    if: always()
    needs: [candidate, test-package]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.candidate.result }}" = success && test "${{ needs.test-package.result }}" = success

  publish-npm:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [candidate, test-package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.revision }}
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          check-latest: true
          node-version: 26.x
          registry-url: https://registry.npmjs.org/
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: candidate
      - name: Verify candidate identity
        env:
          EXPECTED_DIGEST: ${{ needs.candidate.outputs.digest }}
        run: node scripts/verify-candidate.js candidate/package.tgz
      - name: Publish to npm
        env:
          NPM_DIST_TAG: ${{ needs.candidate.outputs.npm_tag }}
        run: npm publish "$CANDIDATE_TARBALL" --tag "$NPM_DIST_TAG"
